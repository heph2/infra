apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: garage
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-init
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: tyr
      containers:
        - name: init
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-openobserve
                  key: accessKey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-openobserve
                  key: secretKey
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-admin
                  key: token
          command:
            - /bin/sh
            - -ec
            - |
              api=http://garage-garage.garage.svc.cluster.local:3903
              request() {
                curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN" "$@"
              }

              while ! status=$(request "$api/v1/status"); do
                sleep 5
              done
              node_id=$(printf '%s' "$status" | sed -n 's/.*"node":"\([^"]*\)".*/\1/p')
              test -n "$node_id"

              layout=$(request "$api/v1/layout")
              if ! printf '%s' "$layout" | grep -q "\"$node_id\""; then
                request -X POST "$api/v1/layout" \
                  -H 'Content-Type: application/json' \
                  --data "[{\"id\":\"$node_id\",\"zone\":\"tyr\",\"capacity\":40000000000,\"tags\":[]}]" \
                  >/dev/null
                layout=$(request "$api/v1/layout")
                version=$(printf '%s' "$layout" | sed -n 's/.*"version":\([0-9][0-9]*\).*/\1/p' | head -n 1)
                test -n "$version"
                request -X POST "$api/v1/layout/apply" \
                  -H 'Content-Type: application/json' \
                  --data "{\"version\":$((version + 1))}" \
                  >/dev/null
              fi

              if ! request "$api/v1/key?search=openobserve" | grep -q "\"$ACCESS_KEY\""; then
                request -X POST "$api/v1/key/import" \
                  -H 'Content-Type: application/json' \
                  --data "{\"name\":\"openobserve\",\"accessKeyId\":\"$ACCESS_KEY\",\"secretAccessKey\":\"$SECRET_KEY\"}" \
                  >/dev/null
              fi

              if ! request "$api/v1/bucket?globalAlias=openobserve" >/dev/null; then
                request -X POST "$api/v1/bucket" \
                  -H 'Content-Type: application/json' \
                  --data "{\"globalAlias\":\"openobserve\",\"localAlias\":{\"accessKeyId\":\"$ACCESS_KEY\",\"alias\":\"openobserve\",\"allow\":{\"read\":true,\"write\":true,\"owner\":true}}}" \
                  >/dev/null
              fi
