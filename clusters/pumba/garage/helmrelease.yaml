apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: garage
  chart:
    spec:
      chart: ./script/helm/garage
      sourceRef:
        kind: GitRepository
        name: garage
      interval: 1h
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: add
                path: /spec/ports/-
                value:
                  name: admin
                  port: 3903
                  protocol: TCP
                  targetPort: 3903
            target:
              kind: Service
              name: garage-garage
  values:
    deployment:
      replicaCount: 1
    garage:
      replicationMode: "1"
      metadataAutoSnapshotInterval: 1h
      s3:
        api:
          region: garage
          rootDomain: .s3.garage.internal
        web:
          rootDomain: .web.garage.internal
    persistence:
      enabled: true
      meta:
        size: 1Gi
      data:
        size: 40Gi
    nodeSelector:
      kubernetes.io/hostname: tyr
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    environment:
      - name: GARAGE_DEFAULT_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: garage-openobserve
            key: accessKey
      - name: GARAGE_DEFAULT_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: garage-openobserve
            key: secretKey
      - name: GARAGE_DEFAULT_BUCKET
        value: openobserve
