apiVersion: v1
kind: ConfigMap
metadata:
  name: openobserve-collector
  namespace: openobserve
data:
  otelcol.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol
        create_directory: true
      basicauth/openobserve:
        client_auth:
          username: ${env:OPENOBSERVE_USER}
          password: ${env:OPENOBSERVE_PASSWORD}

    receivers:
      filelog/kubernetes:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/openobserve_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        max_log_size: 1MiB
        storage: file_storage
        operators:
          - type: container
            id: container-parser
            add_metadata_from_filepath: true

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      otlphttp/openobserve:
        endpoint: http://openobserve.openobserve.svc.cluster.local:5080/api/default
        auth:
          authenticator: basicauth/openobserve
        retry_on_failure:
          enabled: true
          initial_interval: 2s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 256

    service:
      extensions:
        - file_storage
        - basicauth/openobserve
      pipelines:
        logs:
          receivers:
            - filelog/kubernetes
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/openobserve
