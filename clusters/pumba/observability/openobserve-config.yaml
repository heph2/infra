apiVersion: v1
kind: ConfigMap
metadata:
  name: openobserve-config
  namespace: openobserve
data:
  ZO_LOCAL_MODE: "true"
  ZO_LOCAL_MODE_STORAGE: s3
  ZO_META_STORE: sqlite
  ZO_DATA_DIR: /data
  ZO_HTTP_ADDR: 0.0.0.0
  ZO_HTTP_PORT: "5080"
  ZO_S3_SERVER_URL: http://garage.garage.svc.cluster.local:3900
  ZO_S3_BUCKET_NAME: openobserve
  ZO_S3_REGION_NAME: garage
  ZO_S3_PROVIDER: s3
  ZO_HEALTH_CHECK_ENABLED: "true"
