apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: garage
  namespace: flux-system
spec:
  interval: 1h
  url: https://git.deuxfleurs.fr/Deuxfleurs/garage.git
  ref:
    tag: v1.3.1
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pumba-garage
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/pumba/garage
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: garage
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pumba-observability
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: pumba-garage
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/pumba/observability
