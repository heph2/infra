services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lorebound
      POSTGRES_USER: lorebound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /run/agenix/lorebound-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorebound -d lorebound"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in /run/agenix/lorebound-env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in /run/agenix/lorebound-env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ghcr.io/heph2/lorebound-backend:${LOREBOUND_IMAGE_TAG:?Set LOREBOUND_IMAGE_TAG to a published commit SHA}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://lorebound:${POSTGRES_PASSWORD}@postgres:5432/lorebound?ssl_mode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      EVENTS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      WE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      LOCKING_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: "false"
      MEDUSA_BACKEND_URL: https://api.lorebound.shop
      STORE_CORS: ${STORE_CORS:?Set STORE_CORS in /run/agenix/lorebound-env}
      ADMIN_CORS: https://api.lorebound.shop
      AUTH_CORS: ${AUTH_CORS:?Set AUTH_CORS in /run/agenix/lorebound-env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in /run/agenix/lorebound-env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in /run/agenix/lorebound-env}
      FILE_STORAGE_PROVIDER: s3
      S3_FILE_URL: ${S3_FILE_URL:?Set S3_FILE_URL to the public R2 bucket domain}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the R2 access key ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the R2 secret access key}
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET:?Set the R2 bucket name}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the account-specific R2 S3 endpoint}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
